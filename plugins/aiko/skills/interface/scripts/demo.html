<!doctype html>
<!--
  Demo of reactions.js and reactions.css. Open this file straight from disk:
  reactions.js loads as a classic script, so file:// works in Chrome too.
  Two origins: a face in a video-like tile, and elements on a light page (a button, a like, an avatar).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reactions demo</title>
<link rel="stylesheet" href="reactions.css">
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #F3F4F6; color: #1E2939; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; display: grid; gap: 32px }
  h1 { margin: 0; font-size: 26px }
  h2 { margin: 0 0 12px; font-size: 18px }
  p { margin: 0; color: #6A7282 }
  .grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: start }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr } }

  /* A neutral placeholder for a video: grey, with a soft shape where a head would be. */
  .tile { position: relative; aspect-ratio: 5 / 4; border-radius: 16px; overflow: hidden;
    background: radial-gradient(ellipse 16% 20% at 50% 26%, #9AA3B2 0 98%, transparent 100%),
                radial-gradient(ellipse 34% 30% at 50% 82%, #8A93A3 0 98%, transparent 100%),
                linear-gradient(#5B6475, #3F4756) }
  .tile.small { width: 300px; aspect-ratio: 4 / 3 }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px }
  button { font: inherit; font-weight: 600; font-size: 15px; line-height: 1; border: 1px solid #D1D5DC; background: #fff; color: inherit; border-radius: 10px; padding: 10px 14px; cursor: pointer }
  button:hover { border-color: #3B82F6 }
  button:focus-visible { outline: 2px solid #3B82F6; outline-offset: 2px }
  button[aria-pressed="true"] { border-color: #3B82F6; background: #EFF5FF }

  /* The light page: a card with a publish button, a like and a chat line with an avatar. */
  .card { background: #fff; border: 1px solid #E5E7EB; border-radius: 16px; padding: 20px; display: grid; gap: 40px }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
  .primary { background: #3B82F6; border-color: #3B82F6; color: #fff }
  .primary:hover { background: #2563EB }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: #C7CDD8; flex: none }
  .msg { background: #F3F4F6; border-radius: 12px; padding: 8px 12px }
</style>
</head>
<body>
<main>
  <div>
    <h1>Reactions</h1>
    <p>Each button plays one reaction. "Think" stays until you press it again. Turn on reduced motion in the system to see the calm version.</p>
  </div>

  <section>
    <h2>From a face in a video tile</h2>
    <div class="grid">
      <div class="tile" id="big"></div>
      <div class="tile small" id="small"></div>
    </div>
    <div class="buttons" id="tile-buttons"></div>
  </section>

  <section>
    <h2>From elements on a page</h2>
    <div class="card">
      <div class="row">
        <button class="primary" id="publish" type="button">Publish</button>
        <p>Stars from the button.</p>
      </div>
      <div class="row">
        <button id="like" type="button" aria-label="Like">&#9825; Like</button>
        <p>Hearts from the like button.</p>
      </div>
      <div class="row">
        <span class="avatar" id="avatar"></span>
        <span class="msg">Let me check that for you</span>
        <button id="avatar-think" type="button" aria-pressed="false">Think</button>
        <button id="avatar-laugh" type="button">Laugh</button>
        <button id="avatar-yes" type="button">Yes</button>
      </div>
    </div>
  </section>
</main>

<script src="reactions.js"></script>
<script>
  const R = window.AikoReactions;
  const tiles = [R.mountLayer(document.getElementById("big")), R.mountLayer(document.getElementById("small"))];
  const page = R.mountLayer(document.body, { fixed: true });
  page.classList.add("rx-light"); // the page is light: tint the glass so white glyphs read

  // A "think" button starts the bubble on the first press and pops it on the second.
  function thinkToggle(button, start) {
    let handles = null;
    button.addEventListener("click", () => {
      if (handles) {
        handles.forEach((h) => h.stop());
        handles = null;
        button.setAttribute("aria-pressed", "false");
      } else {
        handles = start();
        button.setAttribute("aria-pressed", "true");
      }
    });
  }

  const bar = document.getElementById("tile-buttons");
  for (const kind of R.KINDS) {
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.kind = kind;
    b.textContent = kind[0].toUpperCase() + kind.slice(1);
    bar.appendChild(b);
    if (kind === "think") {
      b.setAttribute("aria-pressed", "false");
      thinkToggle(b, () => tiles.map((layer) => R.playReaction(layer, "think")));
    } else b.addEventListener("click", () => tiles.forEach((layer) => R.playReaction(layer, kind)));
  }

  const el = (id) => document.getElementById(id);
  el("publish").addEventListener("click", () => R.playReaction(page, "stars", { from: el("publish") }));
  el("like").addEventListener("click", () => R.playReaction(page, "love", { from: el("like") }));
  el("avatar-laugh").addEventListener("click", () => R.playReaction(page, "laugh", { from: el("avatar") }));
  el("avatar-yes").addEventListener("click", () => R.playReaction(page, "yes", { from: el("avatar") }));
  thinkToggle(el("avatar-think"), () => [R.playReaction(page, "think", { from: el("avatar") })]);
</script>
</body>
</html>
