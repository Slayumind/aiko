name: An idea
description: Something Aiko could do, or could do better.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Aiko's roadmap is short on purpose. An idea that doesn't fit it can still be good, but it may
        wait a long time. Say what you were trying to do: that helps more than a feature description.

  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do
      description: The moment it went wrong, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What Aiko could do instead.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: What you use now, if anything, and what is wrong with it.
    validations:
      required: false
