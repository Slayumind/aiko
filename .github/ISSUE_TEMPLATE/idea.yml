name: An idea
description: Something Aiko could do, or could do better.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Aiko has a roadmap, and it is short on purpose. An idea that does not fit it may still be a
        good idea, but it may wait a long time. Saying what you were trying to do helps more than
        describing the feature.

  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do
      description: The moment it went wrong, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: What Aiko could do instead.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: What you use now, if anything, and what is wrong with it.
    validations:
      required: false
