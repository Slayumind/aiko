# Build and test on every push and pull request.
#
# Actions are pinned to a commit, not to a tag: a tag can be moved, and then a build would run
# somebody else's code.
name: build

on:
  push:
    branches: [main, in-progress]
  pull_request:

permissions:
  contents: read

env:
  # Pinned, so a new Claude Code release cannot fail an old commit.
  CLAUDE_CODE: '@anthropic-ai/claude-code@2.1.272'

jobs:
  build:
    # Aiko is a Windows app and its tests build the whole solution.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Aiko.slnx

      - name: Build
        run: dotnet build Aiko.slnx --configuration Release --no-restore

      - name: Test
        # The core tests include the ones that matter most here: the credentials object never
        # prints its token, and the snapshot format can hold nothing but numbers and times.
        run: dotnet test Aiko.slnx --configuration Release --no-build --verbosity quiet

      - name: Test the skill scripts
        # The scripts inside Aiko's skills have tests of their own. Node and Python come with the runner.
        shell: pwsh
        run: |
          Get-ChildItem plugins, tools -Recurse -Filter *.test.mjs | ForEach-Object { node --test $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }
          Get-ChildItem plugins -Recurse -Filter test_*.py | Select-Object -ExpandProperty DirectoryName -Unique | ForEach-Object {
            Push-Location $_; python -m unittest; $code = $LASTEXITCODE; Pop-Location
            if ($code -ne 0) { exit 1 }
          }

      - name: Validate the plugins
        # Claude Code checks the marketplace and every plugin the way it would when installing them.
        shell: pwsh
        run: |
          npx --yes $env:CLAUDE_CODE plugin validate .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem plugins -Directory | ForEach-Object {
            npx --yes $env:CLAUDE_CODE plugin validate $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Validate the persona plugin
        # This plugin is not in the repository. The bridge builds it when Claude Code asks, so the
        # step above never sees it. Here the bridge builds it the same way and prints its folder.
        # The config folder is an empty one of ours, so the plugin is the one a new user gets.
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude'
          New-Item -ItemType Directory -Force $env:CLAUDE_CONFIG_DIR | Out-Null
          $folder = & src/Aiko.Bridge/bin/Release/net10.0/Aiko.Bridge.exe plugin aiko-persona
          if ($LASTEXITCODE -ne 0) { throw "The bridge did not build the persona plugin: exit $LASTEXITCODE." }
          npx --yes $env:CLAUDE_CODE plugin validate $folder
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the code style
        # .editorconfig holds the rules and Directory.Build.props asks the compiler to enforce
        # them. This catches what the compiler alone does not, so the rules are real rather than
        # written down.
        run: dotnet format Aiko.slnx --verify-no-changes --verbosity quiet

  mac:
    # The Swift core of the coming macOS app. It repeats the rules of Aiko.Core case for case, and
    # some of those cases come from the shared files in spec/, so the whole repository is checked out.
    runs-on: macos-15

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Show the toolchain
        run: swift --version

      - name: Build
        working-directory: mac
        run: swift build

      - name: Test
        working-directory: mac
        run: swift test

      - name: Run the two programs
        working-directory: mac
        # Proof that the built files start and their runtime is complete. The bridge answers an
        # empty status line payload with nothing at all and exit 0, as it does on Windows. The
        # config folder is an empty one of ours, so the runner's own ~/.claude is never read.
        run: |
          bin=$(swift build --show-bin-path)
          mkdir -p "$RUNNER_TEMP/claude"
          echo '{}' | CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude" "$bin/aiko-bridge"
          AIKO_SHIM_SELF_TEST=1 "$bin/aiko-shim"

      - name: Validate the persona plugin
        working-directory: mac
        # The Swift bridge builds the persona plugin with its own code, so it is checked here too.
        run: |
          set -euo pipefail
          bin=$(swift build --show-bin-path)
          mkdir -p "$RUNNER_TEMP/claude"
          folder=$(CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude" "$bin/aiko-bridge" plugin aiko-persona)
          npx --yes "$CLAUDE_CODE" plugin validate "$folder"
