# Build and test on every push and pull request.
#
# Actions are pinned to a commit, not to a tag: a tag can be moved, and then a build would run
# somebody else's code.
name: build

on:
  push:
    branches: [main, in-progress]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Aiko is a Windows app and its tests build the whole solution.
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Aiko.slnx

      - name: Build
        run: dotnet build Aiko.slnx --configuration Release --no-restore

      - name: Test
        # The core tests include the ones that matter most here: the credentials object never
        # prints its token, and the snapshot format can hold nothing but numbers and times.
        run: dotnet test Aiko.slnx --configuration Release --no-build --verbosity quiet

      - name: Test the skill scripts
        # The scripts inside Aiko's skills have tests of their own. Node and Python come with the runner.
        shell: pwsh
        run: |
          Get-ChildItem plugins, tools -Recurse -Filter *.test.mjs | ForEach-Object { node --test $_.FullName; if ($LASTEXITCODE -ne 0) { exit 1 } }
          Get-ChildItem plugins -Recurse -Filter test_*.py | Select-Object -ExpandProperty DirectoryName -Unique | ForEach-Object {
            Push-Location $_; python -m unittest; $code = $LASTEXITCODE; Pop-Location
            if ($code -ne 0) { exit 1 }
          }

      - name: Validate the plugins
        # Claude Code checks the marketplace and every plugin the way it would when installing them.
        # Pinned, so a new Claude Code release cannot fail an old commit.
        shell: pwsh
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.272 plugin validate .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem plugins -Directory | ForEach-Object {
            npx --yes @anthropic-ai/claude-code@2.1.272 plugin validate $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Check the code style
        # .editorconfig holds the rules and Directory.Build.props asks the compiler to enforce
        # them. This catches what the compiler alone does not, so the rules are real rather than
        # written down.
        run: dotnet format Aiko.slnx --verify-no-changes --verbosity quiet
